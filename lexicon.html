<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<script src="/native-insets.js"></script>
<meta charset="UTF-8">
<script src="/bible-ref.js"></script>
<script src="/i18n.js"></script>
<script src="/i18n-en.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KODESH · Lexicón Bíblico</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #c9a84c; --gold-bright: #e8c46a;
  --gold-dim: rgba(201,168,76,0.2); --gold-glow: rgba(201,168,76,0.08);
  --bg: #06060e; --bg2: #0b0b16; --bg3: #10101e;
  --text: #ede5d0; --text-mid: #a89878; --text-dim: #4a4030;
  --border: rgba(255,255,255,0.05); --border2: rgba(201,168,76,0.15);
}
html[data-theme="light"] {
  --bg: #faf8f3; --bg2: #f3efe4; --bg3: #ede8d8;
  --text: #1a1408; --text-mid: #6b5a38; --text-dim: #b0a080;
  --border: rgba(0,0,0,0.06); --border2: rgba(201,168,76,0.3);
}
html, body {
  min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: 'EB Garamond', Georgia, serif; overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--bg2); border-bottom: 1px solid var(--border2);
  padding-left: 24px; padding-right: 24px;
  padding-top: max(14px, env(safe-area-inset-top));
  padding-bottom: 14px;
  display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.back-btn {
  font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 2px;
  color: var(--text-dim); text-decoration: none; text-transform: uppercase;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--gold); }
.topbar-title {
  font-family: 'Cinzel', serif; font-size: 0.75rem;
  letter-spacing: 4px; color: var(--gold); text-transform: uppercase;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.theme-toggle {
  background: none; border: 1px solid var(--border2); border-radius: 20px;
  padding: 4px 12px; font-size: 0.7rem; cursor: pointer;
  color: var(--text-mid); transition: all 0.2s;
}
.theme-toggle:hover { border-color: var(--gold); color: var(--gold); }
.count-badge {
  font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 2px;
  color: var(--text-dim); text-transform: uppercase;
}

/* ── SEARCH ── */
.search-wrap {
  max-width: 800px; margin: 24px auto; padding: 0 20px;
}
.search-bar {
  display: flex; gap: 10px; align-items: center;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 16px;
  transition: border-color 0.2s;
}
.search-bar:focus-within { border-color: var(--gold); }
.search-input {
  flex: 1; background: none; border: none; outline: none;
  font-family: 'EB Garamond', serif; font-size: 1rem;
  color: var(--text);
}
.search-input::placeholder { color: var(--text-dim); }

/* ── FILTERS ── */
.filters {
  max-width: 800px; margin: 0 auto 20px; padding: 0 20px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.filter-btn {
  font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 5px 14px; border-radius: 20px;
  border: 1px solid var(--border2); background: none;
  color: var(--text-dim); cursor: pointer; transition: all 0.2s;
}
.filter-btn.active, .filter-btn:hover {
  border-color: var(--gold); color: var(--gold); background: var(--gold-glow);
}
.filter-btn.heb.active { border-color: #4a9eff; color: #4a9eff; background: rgba(74,158,255,0.08); }
.filter-btn.grk.active { border-color: #a84cc9; color: #a84cc9; background: rgba(168,76,201,0.08); }

/* ── ALPHABET BAR ── */
.alpha-bar {
  max-width: 800px; margin: 0 auto 24px; padding: 0 20px;
  display: flex; flex-wrap: wrap; gap: 4px;
}
.alpha-btn {
  font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 1px;
  padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border);
  background: none; color: var(--text-dim); cursor: pointer; transition: all 0.15s;
  text-transform: uppercase;
}
.alpha-btn:hover, .alpha-btn.active {
  border-color: var(--gold-dim); color: var(--gold); background: var(--gold-glow);
}
.alpha-btn.has-words { border-color: var(--border2); color: var(--text-mid); }

/* ── GLOSARIO GRID ── */
.main {
  max-width: 800px; margin: 0 auto; padding: 0 20px 60px;
}

.letter-section { margin-bottom: 32px; }
.letter-header {
  font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700;
  color: var(--gold); letter-spacing: 3px;
  padding-bottom: 8px; margin-bottom: 14px;
  border-bottom: 1px solid var(--border2);
  text-transform: uppercase;
}

.word-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 10px;
}
@media(max-width: 600px) { .word-grid { grid-template-columns: 1fr; } }

.word-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  transition: all 0.2s; cursor: default;
}
.word-card:hover {
  border-color: var(--border2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.word-card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px; margin-bottom: 8px;
}
.word-original {
  font-size: 1.4rem; line-height: 1;
  color: var(--gold);
}
.word-original.greek { color: #a84cc9; }
.word-badges { display: flex; gap: 4px; flex-shrink: 0; }
.lang-badge {
  font-family: 'Cinzel', serif; font-size: 0.48rem; letter-spacing: 1px;
  padding: 2px 7px; border-radius: 3px; text-transform: uppercase;
}
.lang-badge.heb {
  background: rgba(74,158,255,0.1); color: #4a9eff;
  border: 1px solid rgba(74,158,255,0.2);
}
.lang-badge.grk {
  background: rgba(168,76,201,0.1); color: #a84cc9;
  border: 1px solid rgba(168,76,201,0.2);
}
.word-testament {
  font-family: 'Cinzel', serif; font-size: 0.45rem; letter-spacing: 1px;
  padding: 2px 7px; border-radius: 3px; text-transform: uppercase;
  background: var(--bg3); color: var(--text-dim); border: 1px solid var(--border);
}
.word-translit {
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  color: var(--text-mid); margin-bottom: 2px; font-style: italic;
}
.word-strongs {
  font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
  color: var(--text-dim); margin-bottom: 6px;
}
.word-spanish {
  font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 1px;
  color: var(--text); text-transform: capitalize; margin-bottom: 6px;
  font-weight: 600;
}
.word-definition {
  font-size: 0.88rem; color: var(--text-mid); line-height: 1.5;
  font-style: italic;
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-dim);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 16px; }
.empty-title {
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 3px;
  color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px;
}
.empty-sub { font-size: 0.9rem; font-style: italic; }

/* ── MODOS (Palabras / Diccionario Strong's) ── */
.mode-tabs { display: flex; gap: 6px; padding: 0 20px 12px; max-width: 900px; margin: 0 auto; }
.mode-tab {
  flex: 1; background: none; border: 1px solid var(--border, rgba(201,168,76,0.2)); color: var(--text-dim);
  font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 10px 8px; border-radius: 10px; cursor: pointer;
}
.mode-tab.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }
.mode-tab .n { display: block; font-family: 'Crimson Pro', serif; font-size: 0.75rem; letter-spacing: 0; text-transform: none; margin-top: 2px; opacity: 0.8; }
.load-more {
  display: block; margin: 8px auto 40px; background: none; border: 1px solid var(--gold-dim, #8a6d2b);
  color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 12px 22px; border-radius: 10px; cursor: pointer;
}
.load-more:disabled { opacity: 0.5; }
.result-note { text-align: center; font-size: 0.8rem; color: var(--text-dim); font-style: italic; margin: 4px 0 14px; }

/* ── LOADING ── */
.loading { text-align: center; padding: 40px; color: var(--text-dim); font-style: italic; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="/index.html" class="back-btn">← Inicio</a>
    <div class="topbar-title">✦ Lexicón Bíblico</div>
  </div>
  <div class="topbar-right">
    <span class="count-badge" id="countBadge">— palabras</span>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-bar">
    <span style="color:var(--text-dim);font-size:1rem">🔍</span>
    <input class="search-input" id="searchInput" type="text"
      placeholder="Buscar palabra en español, hebreo, griego o Strong's..."
      oninput="onSearchInput()">
  </div>
</div>

<!-- MODOS -->
<div class="mode-tabs">
  <button class="mode-tab active" data-mode="words" onclick="setMode('words')">Palabras<span class="n" id="nWords">—</span></button>
  <button class="mode-tab" data-mode="strongs" onclick="setMode('strongs')">Diccionario Strong's<span class="n" id="nStrongs">—</span></button>
</div>

<!-- FILTERS -->
<div class="filters">
  <span style="font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase">Filtrar:</span>
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">Todos</button>
  <button class="filter-btn heb" data-filter="heb" onclick="setFilter('heb',this)">Hebreo AT</button>
  <button class="filter-btn grk" data-filter="grk" onclick="setFilter('grk',this)">Griego NT</button>
</div>

<!-- ALPHABET BAR -->
<div class="alpha-bar" id="alphaBar"></div>

<!-- MAIN CONTENT -->
<div class="main" id="mainContent">
  <div class="loading">Cargando el lexicón...</div>
</div>

<script>
const SUPABASE_URL = 'https://fvknbqdsgqdmwirrgcvb.supabase.co';
// Clave de sesion fijada a mano. supabase-js la deduce del subdominio de la
// URL, asi que el dia que apuntemos a un dominio propio (auth.kodeshbible.com)
// pasaria a buscar "sb-auth-auth-token" y dejaria fuera a todas las sesiones ya
// guardadas: todos los usuarios, web y nativo, quedarian deslogueados de golpe.
// Fijandola al valor historico, cambiar de dominio no toca las sesiones.
const SB_STORAGE_KEY = 'sb-fvknbqdsgqdmwirrgcvb-auth-token';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2a25icWRzZ3FkbXdpcnJnY3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzU2NjYsImV4cCI6MjA5NjExMTY2Nn0.RqiuH5fafECN1yW5MjBP3zzHAdXLH4QD3gBL_WZ-hB0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: SB_STORAGE_KEY } });

let allWords = [];          // palabras en español (pocas: se cargan todas)
let activeFilter = 'all';
let activeLetter = null;
let mode = 'words';          // 'words' | 'strongs'
const PAGE = 60;
let strongsRows = [], strongsDone = false, strongsLoading = false, strongsReq = 0, searchTimer = null;
const LEX_COLS = 'word, testament, strongs, lemma, transliteration, pronunciation, definition, language';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('es');
// Inglés: solo el diccionario original de Strong (en inglés, dominio público) desde data/strongs-en.json;
// las entradas guardadas en lexicon_cache están en español y no se muestran.
const EN = !!(window.KodeshI18n && KodeshI18n.isEn);
const TX = (t, v) => window.KodeshI18n ? KodeshI18n.t(t, v) : t;
let STRONGS_EN = null;
async function loadStrongsEn() {
  if (!STRONGS_EN) {
    const rows = await fetch('/data/strongs-en.json').then(r => r.json());
    STRONGS_EN = rows.map(([code, lemma, xlit, pron, def]) => ({
      word: 'strongs_' + code.toLowerCase(), strongs: code, lemma, transliteration: xlit, pronunciation: pron, definition: def,
      language: code[0] === 'G' ? 'griego' : 'hebreo', testament: code[0] === 'G' ? 'NT' : 'AT',
      _s: (code + ' ' + lemma + ' ' + xlit + ' ' + def).toLowerCase(),
    }));
  }
  return STRONGS_EN;
}

// ── THEME ──
function initTheme() {
  const saved = localStorage.getItem('kodesh_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kodesh_theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}

// ── LOAD DATA ──
// PostgREST devuelve como máximo 1000 filas por consulta: por eso el
// contador marcaba "1000 palabras". Ahora se cuenta en el servidor, las
// palabras en español se cargan por tramos y el diccionario Strong's
// (~14.000 entradas) se pagina y se busca en el servidor.
async function countRows(isStrongs) {
  const q = sb.from('lexicon_cache').select('word', { count: 'exact', head: true });
  const { count, error } = await (isStrongs ? q.like('word', 'strongs\\_%') : q.not('word', 'like', 'strongs\\_%'));
  if (error) throw error;
  return count || 0;
}

async function loadCounts() {
  try {
    const [w, st] = await Promise.all([countRows(false), countRows(true)]);
    document.getElementById('nWords').textContent = fmt(w);
    document.getElementById('nStrongs').textContent = fmt(st);
    document.getElementById('countBadge').textContent = window.KodeshI18n ? KodeshI18n.t('{n} entradas', { n: fmt(w + st) }) : `${fmt(w + st)} entradas`;
  } catch (e) { console.warn('count', e); }
}

async function loadLexicon() {
  if (EN) {
    mode = 'strongs';
    document.querySelector('.mode-tabs').style.display = 'none';
    document.getElementById('alphaBar').style.display = 'none';
    document.getElementById('searchInput').placeholder = TX("Buscar en hebreo, griego, transliteración o Strong's...");
    try {
      const all = await loadStrongsEn();
      document.getElementById('countBadge').textContent = TX('{n} entradas', { n: fmt(all.length) });
      resetStrongs();
    } catch (e) {
      console.error(e);
      document.getElementById('mainContent').innerHTML = `<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-title">${TX('No se pudo cargar el lexicón')}</div><div class="empty-sub">${TX('Revisa tu conexión e intenta de nuevo.')}</div></div>`;
    }
    return;
  }
  loadCounts();
  try {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from('lexicon_cache').select(LEX_COLS)
        .not('word', 'like', 'strongs\\_%')
        .order('word', { ascending: true }).range(from, from + 999);
      if (error) throw error;
      rows.push(...(data || []));
      if (!data || data.length < 1000) break;
    }
    allWords = rows.filter(w => w.strongs && w.lemma);
    buildAlphaBar();
    render();
  } catch(e) {
    console.error(e);
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <div class="empty-title">No se pudo cargar el lexicón</div>
        <div class="empty-sub">Revisa tu conexión e intenta de nuevo.</div>
      </div>`;
  }
}

// ── MODO / BÚSQUEDA ──
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  document.getElementById('alphaBar').style.display = m === 'words' ? '' : 'none';
  if (m === 'strongs') resetStrongs(); else render();
}

function onSearchInput() {
  const q = document.getElementById('searchInput').value.trim();
  // Un número Strong's (H413, g26) lleva directo al diccionario.
  if (mode === 'words' && /^[hg]\d+$/i.test(q)) { setMode('strongs'); return; }
  if (mode === 'strongs') {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(resetStrongs, 300);
  } else render();
}

function render() {
  if (mode === 'strongs') return renderStrongs();
  renderWords();
}

function resetStrongs() {
  strongsRows = []; strongsDone = false;
  document.getElementById('mainContent').innerHTML = '<div class="loading">Buscando…</div>';
  loadMoreStrongs();
}

async function loadMoreStrongs() {
  if (strongsLoading || strongsDone) return;
  strongsLoading = true;
  const req = ++strongsReq;
  const raw = document.getElementById('searchInput').value.trim();
  if (EN) {
    const all = await loadStrongsEn();
    const code = raw.match(/^([hg])0*(\d+)$/i), term = raw.toLowerCase();
    const hits = all.filter(w => (activeFilter !== 'heb' || w.language === 'hebreo') && (activeFilter !== 'grk' || w.language === 'griego')
      && (code ? w.strongs === code[1].toUpperCase() + code[2] : raw.length < 2 || w._s.includes(term)));
    strongsRows = hits.slice(0, strongsRows.length + PAGE);
    strongsDone = strongsRows.length >= hits.length;
    strongsLoading = false;
    renderStrongs();
    return;
  }
  let q = sb.from('lexicon_cache').select(LEX_COLS).like('word', 'strongs\\_%');
  if (activeFilter === 'heb') q = q.eq('testament', 'AT');
  if (activeFilter === 'grk') q = q.eq('testament', 'NT');
  const code = raw.match(/^([hg])0*(\d+)$/i);
  if (code) {
    q = q.eq('strongs', code[1].toUpperCase() + code[2]);
  } else if (raw.length >= 2) {
    const term = raw.replace(/[%,()*\\]/g, ' ').trim();
    q = q.or(`lemma.ilike.*${term}*,transliteration.ilike.*${term}*,definition.ilike.*${term}*`);
  }
  try {
    const { data, error } = await q.order('testament', { ascending: true }).order('strongs_num', { ascending: true })
      .range(strongsRows.length, strongsRows.length + PAGE - 1);
    if (req !== strongsReq) return;   // llegó una búsqueda más nueva
    if (error) throw error;
    strongsRows.push(...(data || []));
    strongsDone = !data || data.length < PAGE;
    renderStrongs();
  } catch (e) {
    console.error(e);
    if (req === strongsReq) document.getElementById('mainContent').innerHTML = '<div class="loading">No se pudo cargar. Intenta de nuevo.</div>';
  } finally {
    if (req === strongsReq) strongsLoading = false;
  }
}

function renderStrongs() {
  const main = document.getElementById('mainContent');
  if (!strongsRows.length) {
    main.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">Sin resultados</div>
      <div class="empty-sub">Prueba con un número (H430, G26), una palabra hebrea o griega, su transliteración o una palabra de la definición.</div></div>`;
    return;
  }
  main.innerHTML = `<div class="word-grid">${strongsRows.map(renderWordCard).join('')}</div>`
    + (strongsDone ? '' : `<button class="load-more" onclick="this.disabled=true;loadMoreStrongs()">Cargar más</button>`);
}

function normalizeFirstLetter(word) {
  const first = word[0]?.toUpperCase() || '#';
  return first.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// ── ALPHABET BAR ──
function buildAlphaBar() {
  const letters = new Set(allWords.map(w => normalizeFirstLetter(w.word)).filter(Boolean));
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const bar = document.getElementById('alphaBar');
  bar.innerHTML = `<button class="alpha-btn active" onclick="setLetter(null,this)">Todas</button>`;
  alphabet.forEach(l => {
    if (letters.has(l)) {
      bar.innerHTML += `<button class="alpha-btn has-words" onclick="setLetter('${l}',this)">${l}</button>`;
    }
  });
}

function setLetter(letter, btn) {
  activeLetter = letter;
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'strongs') resetStrongs(); else render();
}

function getFilteredWords() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  return allWords.filter(w => {
    // Language filter
    if (activeFilter === 'heb' && w.language !== 'hebreo') return false;
    if (activeFilter === 'grk' && w.language !== 'griego') return false;
    // Letter filter
    if (activeLetter && normalizeFirstLetter(w.word) !== activeLetter) return false;
    // Search filter
    if (query) {
      return w.word.includes(query) ||
        w.lemma?.toLowerCase().includes(query) ||
        w.strongs?.toLowerCase().includes(query) ||
        w.transliteration?.toLowerCase().includes(query) ||
        w.definition?.toLowerCase().includes(query);
    }
    return true;
  });
}

function renderWords() {
  const filtered = getFilteredWords();
  const main = document.getElementById('mainContent');

  if (filtered.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Sin resultados</div>
        <div class="empty-sub">No se encontraron palabras con ese filtro.<br>Prueba en el Diccionario Strong's.</div>
      </div>`;
    return;
  }

  // Group by first letter
  const grouped = {};
  filtered.forEach(w => {
    const letter = normalizeFirstLetter(w.word);
    if (!grouped[letter]) grouped[letter] = [];
    grouped[letter].push(w);
  });

  const letters = Object.keys(grouped).sort();
  main.innerHTML = letters.map(letter => `
    <div class="letter-section">
      <div class="letter-header">${letter}</div>
      <div class="word-grid">
        ${grouped[letter].map(w => renderWordCard(w)).join('')}
      </div>
    </div>
  `).join('');
}

function renderWordCard(w) {
  const isGreek = w.language === 'griego';
  const langClass = isGreek ? 'grk' : 'heb';
  const langLabel = isGreek ? 'Griego' : 'Hebreo';
  const testamentLabel = w.testament === 'NT' ? 'Nuevo Testamento' : 'Antiguo Testamento';
  const isStrongsEntry = String(w.word).startsWith('strongs_');
  // Las entradas del diccionario se guardan como "strongs_h413": se muestra
  // el número, no la clave interna.
  const title = isStrongsEntry ? (w.strongs || '') : w.word;

  return `
    <div class="word-card">
      <div class="word-card-top">
        <div data-noi18n class="word-original ${isGreek ? 'greek' : ''}">${esc(w.lemma || '—')}</div>
        <div class="word-badges">
          <span class="lang-badge ${langClass}">${langLabel}</span>
          <span class="word-testament">${testamentLabel}</span>
        </div>
      </div>
      <div data-noi18n class="word-spanish">${esc(title)}</div>
      ${w.transliteration ? `<div data-noi18n class="word-translit">${esc(w.transliteration)}${w.pronunciation ? ` · ${esc(w.pronunciation)}` : ''}</div>` : ''}
      ${isStrongsEntry ? '' : `<div data-noi18n class="word-strongs">${esc(w.strongs || '')}</div>`}
      <div data-noi18n class="word-definition">${esc(w.definition || '—')}</div>
    </div>
  `;
}

// ── INIT ──
initTheme();
loadLexicon();
</script>
